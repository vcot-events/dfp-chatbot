<!doctype html><html lang="en"><meta charset="utf-8"><title>Local audit evidence capture</title><h1>Local audit evidence capture</h1><label for="evidence">Evidence JSON</label><textarea id="evidence" rows="10" cols="80"></textarea><button id="save">Download evidence</button><script>
document.getElementById('save').onclick=()=>{const value=document.getElementById('evidence').value;JSON.parse(value);const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([value],{type:'application/json'}));a.download='dfp-live-results.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
</script></html>
