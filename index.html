    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    color: var(--ink);
    display: flex;
    flex-direction: column;
    height: 100dvh;
  }
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 20px 16px;
    border-bottom: 1px solid var(--line);
    background: #fffdf9;
    flex: none;
  }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .brand-mark {
    width: 38px; height: 38px; border-radius: 8px;
    overflow: hidden; flex: none;
  }
  .brand-mark img {
    width: 100%; height: 100%; object-fit: contain; display: block;
  }
  .brand h1 { font-size: 16px; font-weight: 650; letter-spacing: 0; }
  .brand .sub { font-size: 12px; color: var(--muted); }
  .spacer { flex: 1; }
  .icon-btn {
    width: 36px; height: 36px; border-radius: 6px;
    border: 1px solid var(--line); background: #fff; color: var(--ink);
    display: grid; place-items: center; cursor: pointer; flex: none;
  }
  .icon-btn:hover { background: var(--accent-soft); border-color: var(--accent); }
  .icon-btn:disabled { opacity: .45; cursor: default; }
  .icon-btn:disabled:hover { background: #fff; border-color: var(--line); }

  main { flex: 1; overflow-y: auto; padding: 20px 16px; }
  .thread { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  .msg { display: flex; flex-direction: column; max-width: 78%; }
  .msg.user { align-self: flex-end; align-items: flex-end; }
  .msg .avatar {
    width: 34px; height: 34px; border-radius: 8px;
    object-fit: cover; flex: none;
  }
  .msg .row {
    display: flex; align-items: flex-start; gap: 8px;
  }
  .msg .who { font-size: 12px; color: var(--muted); margin: 0 4px 4px; }
  .msg .body {
    padding: 10px 14px; border-radius: 8px; font-size: 15.5px; line-height: 1.55;
    white-space: pre-wrap; overflow-wrap: anywhere;
  }
  .msg.user .body { background: var(--bubble-user); color: #fff; border-bottom-right-radius: 2px; }
  .msg.bot  .body { background: var(--bubble-bot); border: 1px solid var(--line); border-bottom-left-radius: 2px; }
  .msg.bot.error .body { border-color: var(--danger); color: var(--danger); }
  .msg.bot .body a { color: var(--accent); font-weight: 600; }
  .cursor { display: inline-block; width: 8px; height: 15px; background: var(--accent);
            vertical-align: text-bottom; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  .suggestions {
    width: 720px; max-width: calc(100% - 32px); margin: 14px auto 0;
    display: flex; flex-direction: column; align-items: flex-end; gap: 8px;
  }
  .chip {
    font: inherit; font-size: 14.5px; padding: 9px 14px;
    border: 1px solid var(--line); border-radius: 999px; background: #fff;
    color: var(--ink); cursor: pointer;
  }
  .chip:hover { border-color: var(--accent); background: var(--accent-soft); }

  .load-box {
    max-width: 560px; margin: 8vh auto 0;
    border: 1px solid var(--line); border-radius: 8px; background: #fff;
    padding: 18px 20px;
  }
  .load-box .load-welcome {
    font-size: 26px; font-weight: 700; letter-spacing: 0;
    text-align: center; margin-bottom: 22px;
  }
  .load-box h2 { font-size: 16px; font-weight: 650; margin-bottom: 6px; }
  .load-box .status { font-size: 13px; color: var(--muted); margin-bottom: 12px;
                      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
  .bar-fill { height: 100%; width: 0%; background: var(--accent); transition: width .25s ease; }
  .load-box.error h2 { color: var(--danger); }

  footer { flex: none; border-top: 1px solid var(--line); background: #fffdf9; padding: 18px 16px; }
  .composer { max-width: 720px; margin: 0 auto; display: flex; align-items: flex-end; gap: 10px; }
  textarea {
    flex: 1; font: inherit; font-size: 15.5px; line-height: 1.4;
    padding: 11px 14px; border: 1px solid var(--line); border-radius: 8px;
    background: #fff; color: var(--ink); resize: none;
    min-height: 44px; max-height: 140px;
  }
  textarea:focus { outline: none; border-color: var(--accent); }
  textarea:disabled { background: var(--bg); }
  .send-btn {
    width: 44px; height: 44px; border-radius: 8px; border: none; flex: none;
    background: var(--accent); color: #fff; display: grid; place-items: center; cursor: pointer;
  }
  .send-btn:hover:not(:disabled) { background: #0a6650; }
  .send-btn:disabled { opacity: .45; cursor: default; }
  .send-btn.stop { background: var(--danger); }
  .hidden { display: none !important; }
  @media (max-width: 560px) {
    .brand .sub { display: none; }
    .msg { max-width: 92%; }
  }
</style>
</head>

Faculty FAQ:
What is the Dialogue for Peace Faculty Professional Development Fellowship Program?
We are looking for faculty employed by UC San Diego through the end of Fall quarter of the same year as training who are passionate about learning conflict resolution skills, exploring different perspectives, and building empathy.
What are the main goals of the program?
Empower faculty to facilitate community dialogue and understand how to implement Peacemaking and Restorative Justice practices within their own departments, classrooms, laboratories, studios or communities contributing to a positive campus climate.
What will I learn as a Dialogue For Peace Fellow?
By the end of the program, faculty will develop skills to facilitate open and meaningful conversations, gain a deep understanding of the principles and practices of Peacemaking and Restorative Justice, and create their own final project.
What is the time commitment?
Five 2 hour in-person sessions once per week on Fridays in Spring quarter. Complete a peer facilitation project in Fall quarter, as well as, present their final project at a to be determined date and time. Full attendance at all sessions is required.
What are the benefits of participating in the program?
DFP Fellowships are professional development opportunities where faculty connect with their peers, learn hands-on from experienced professionals, and foster community and belonging on their campus. The program includes lunch socials to strengthen these relationships, and culminates in a final session where the group will celebrate completion of the program and receive further coaching on their project. Faculty will receive $5,000 in discretionary funds following the completion of training sessions and project proposal in Spring quarter, as well as, eight Triton Cash Cards to incentivize participation in their final project rollout.
What is the peer facilitation project?
Each fellow will design and implement a peer facilitation project on campus, applying their newly acquired skills to benefit their community. Further details are outlined in the curriculum and training sessions to be shared upon acceptance into the program.

What is the Dialogue for Peace Student Fellowship Program?
The Student Fellows Program is a five-week journey designed to help student staff build facilitation skills and learn how to collaborate with others across different perspectives.
Who can apply for the DFP Fellows Program?
We are looking for undergraduate or graduate students currently employed by UC San Diego and have an active employee ID number through the final presentation date who are passionate about building empathy, exploring different perspectives, and learning conflict resolution skills.
What are the main goals of the program?
Empower student leaders to facilitate community dialogue and understand how to implement Peacemaking and Restorative Justice practices within their own communities contributing to a positive campus climate.
What will I learn as a Dialogue For Peace Fellow?
By the end of the program, students will gain a deep understanding of the principles of Peacemaking and Restorative Justice, develop skills for open and meaningful conversations, and create their own peer facilitation projects.
What is the time commitment?
Fellows must attend five weekly two-hour sessions and complete a peer facilitation project by the end of Winter Quarter, as well as, present their final project at a luncheon event. Training sessions in person on Thursdays from 4:00-6:00 pm. Complete a peer facilitation project in Winter quarter, as well as, present their project in spring quarter.
What are the benefits of participating in the program?
DFP Fellowships are paid professional development opportunities where students connect with their peers, learn hands-on from experienced professionals, and foster community and belonging on your campus. The program includes weekly dinner socials to strengthen these relationships, and culminates in a final session where the group will celebrate completion of the program and receive further coaching on their project. Students will receive $600 in compensation for their time, $250 toward the development of their project, as well as credit on their co-curricular record for their participation in the program. Full attendance and completion of a final project are required to receive the $600 and co-curricular credit.
What is the peer facilitation project?
Each Fellow will design and implement a peer facilitation project on campus, applying their newly acquired skills to benefit their community.

  const $ = (id) => document.getElementById(id);
  const main = $("main"), thread = $("thread"), suggestions = $("suggestions"),
        loadBox = $("loadBox"), loadTitle = $("loadTitle"), loadStatus = $("loadStatus"),
        barFill = $("barFill"), input = $("input"), sendBtn = $("sendBtn"),
        newChatBtn = $("newChatBtn"), headStatus = $("headStatus");

  const state = { engine: null, busy: false, generating: false, messages: [], conversationId: 0 };
  let webllm = null;

  function showSuggestions() {
    suggestions.innerHTML = "";
    STARTERS.forEach((text) => {
      const chip = document.createElement("button");
      chip.className = "chip";
      chip.textContent = text;
      chip.addEventListener("click", () => { input.value = text; send(); });
      suggestions.appendChild(chip);
    });
    suggestions.classList.remove("hidden");
  }

  function setHead(text) { headStatus.textContent = text; }

  function autoGrow() {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 140) + "px";
  }
  input.addEventListener("input", () => { autoGrow(); refreshSend(); });

  function refreshSend() {
    const hasText = input.value.trim().length > 0;
    if (state.generating) {
      sendBtn.disabled = false;
      sendBtn.classList.add("stop");
      sendBtn.title = "Stop generating";
      sendBtn.setAttribute("aria-label", "Stop generating");
      sendBtn.querySelector("svg").innerHTML =
        '<rect x="6" y="6" width="12" height="12" rx="2"/>';
    } else {
      sendBtn.disabled = !(hasText && state.engine && !state.busy);
      sendBtn.classList.remove("stop");
      sendBtn.title = "Send";
      sendBtn.setAttribute("aria-label", "Send");
      sendBtn.querySelector("svg").innerHTML =
        '<path d="m5 12 14 0"/><path d="m12 5 7 7-7 7"/>';
    }
  }

  function addMsg(role, text) {
    const wrap = document.createElement("div");
    wrap.className = "msg " + (role === "user" ? "user" : "bot");
    const who = document.createElement("div");
    who.className = "who";
    who.textContent = role === "user" ? "You" : "Assistant";
    const body = document.createElement("div");
    body.className = "body";
    if (role === "user") {
      body.textContent = text;
    } else {
      body.innerHTML = formatMarkdown(text);
    }
    if (role === "user") {
      wrap.append(who, body);
    } else {
      const avatar = document.createElement("img");
      avatar.className = "avatar";
      avatar.src = document.querySelector(".brand-mark img").src;
      avatar.alt = "";
      const row = document.createElement("div");
      row.className = "row";
      row.append(avatar, body);
      wrap.append(who, row);
    }
    thread.appendChild(wrap);
    main.scrollTop = main.scrollHeight;
    return body;
  }

  function formatMarkdown(text) {
    const escaped = text
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
    const saved = [];
    let linked = escaped
      .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
      .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, (m, name, url) => {
        if (!linkAllowed(url)) return name;
        saved.push(`<a href="${url}" target="_blank" rel="noopener noreferrer">${name}</a>`);
        return "\u0000" + (saved.length - 1) + "\u0000";
      })
      .replace(/https?:\/\/[^\s<>"')\u0000]+/g, (url) =>
        linkAllowed(url)
          ? `<a href="${url}" target="_blank" rel="noopener noreferrer">${url}</a>`
          : url);
    linked = linked.replace(/\u0000(\d+)\u0000/g, (m, i) => saved[Number(i)]);
    return linked
      .split("\n")
      .map((line) => {
        if (/^#{1,6}\s+/.test(line)) {
          return "<strong>" + line.replace(/^#{1,6}\s+/, "") + "</strong>";
        }
        if (/^[-*]\s+/.test(line)) {
          return "&bull; " + line.replace(/^[-*]\s+/, "");
        }
        return line;
      })
      .join("<br>");
  }

  function showError(text) {
    const body = addMsg("bot", text);
    body.parentElement.classList.add("error");
  }

  async function loadEngine(modelId) {
    loadBox.classList.remove("error", "hidden");
    loadTitle.textContent = "Loading model";
    loadStatus.textContent = "Fetching weights (cached after first visit)...";
    barFill.style.width = "0%";
    setHead("Loading model...");
    input.disabled = true;
    sendBtn.disabled = true;
    newChatBtn.disabled = true;

    try {
      if (!navigator.gpu) {
        throw new Error("This browser does not expose WebGPU. Use a recent Chrome, Edge, or Chrome-based browser.");
      }
      state.engine?.unload?.();
      state.engine = null;
      const engine = await webllm.CreateMLCEngine(modelId, {
        initProgressCallback: (report) => {
          loadStatus.textContent = report.text;
          barFill.style.width = Math.round((report.progress || 0) * 100) + "%";
        },
      });
      state.engine = engine;
      state.messages = [];
      thread.innerHTML = "";
      addMsg("bot", GREETING);
      showSuggestions();
      loadBox.classList.add("hidden");
      input.disabled = false;
      newChatBtn.disabled = false;
      setHead("Ready - running locally");
      input.focus();
    } catch (err) {
      console.error(err);
      loadBox.classList.add("error");
      loadTitle.textContent = "Could not load the model";
      loadStatus.textContent = err?.message || String(err);
      setHead("Load failed");
    }
    refreshSend();
  }

  async function send() {
    if (state.generating) { state.engine.interruptGenerate(); return; }
    const text = input.value.trim();
    if (!text || !state.engine || state.busy) return;

    if (!isOnTopic(text)) {
      input.value = "";
      autoGrow();
      addMsg("user", text);
      addMsg("bot", OFF_TOPIC_REPLY);
      refreshSend();
      return;
    }

    const conversationId = state.conversationId;
    state.busy = true;
    suggestions.classList.add("hidden");
    input.value = "";
    autoGrow();
    addMsg("user", text);

    const botBody = addMsg("bot", "");
    const cursor = document.createElement("span");
    cursor.className = "cursor";
    botBody.appendChild(cursor);

    state.messages.push({ role: "user", content: text });
    state.generating = true;
    refreshSend();

    let reply = "";
    try {
      const stream = await state.engine.chat.completions.create({
        messages: [{ role: "system", content: currentSystemPrompt() }, ...state.messages],
        temperature: 0.7,
        max_tokens: 380,
        stream: true,
      });
      for await (const chunk of stream) {
        if (conversationId !== state.conversationId) break;
        const delta = chunk.choices[0]?.delta?.content || "";
        if (delta) {
          reply += delta;
          botBody.innerHTML = formatMarkdown(reply);
          botBody.appendChild(cursor);
          main.scrollTop = main.scrollHeight;
        }
      }
      if (conversationId === state.conversationId) {
        state.messages.push({ role: "assistant", content: reply });
      }
    } catch (err) {
      if (conversationId !== state.conversationId) return;
      console.error(err);
      if (!reply) botBody.parentElement.classList.add("error");
      botBody.innerHTML = formatMarkdown(reply || (err?.message || "Something went wrong while generating."));
    } finally {
      cursor.remove();
      state.generating = false;
      state.busy = false;
      refreshSend();
      if (conversationId === state.conversationId) {
        main.scrollTop = main.scrollHeight;
        input.focus();
      }
    }
  }

  sendBtn.addEventListener("click", send);
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      send();
    }
  });
  newChatBtn.addEventListener("click", () => {
    state.conversationId++;
    if (state.generating) state.engine.interruptGenerate();
    state.generating = false;
    // Keep busy until the interrupted stream settles; the engine handles one request at a time.
    input.value = "";
    autoGrow();
    refreshSend();
    state.messages = [];
    thread.innerHTML = "";
    addMsg("bot", GREETING);
    showSuggestions();
    input.focus();
  });

  try {
    webllm = await import("https://esm.run/@mlc-ai/web-llm");
    setHead("Choosing model...");
    await loadEngine(MODEL_ID);
  } catch (err) {
    console.error(err);
    loadBox.classList.add("error");
    loadTitle.textContent = "Could not load the chat runtime";
    loadStatus.textContent = err?.message || "The model runtime failed to download.";
    setHead("Load failed");
  }
</script>
</body>
</html>
